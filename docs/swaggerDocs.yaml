paths:
  /auth:
    post:
      tags:
      - Auth
      summary: Autentica um usuário e retorna um token JWT
      description: 'Rota pública. O token retornado vale por 24 horas e deve ser enviado nas demais rotas no cabeçalho `Authorization: Bearer <token>` (botão **Authorize**). O perfil (admin ou consumidor) fica gravado dentro do token no momento do login.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - senha
              properties:
                email:
                  type: string
                  example: ricardo@email.com
                senha:
                  type: string
                  example: '123456'
      responses:
        200:
          description: Token JWT retornado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        400:
          description: Email e senha são obrigatórios
        401:
          description: Senha inválida
        404:
          description: Usuário não encontrado
        500:
          description: Erro interno do servidor
  /usuario:
    post:
      tags:
      - Usuários
      summary: Cadastra um novo usuário
      description: 'Rota pública. O usuário sempre é criado com perfil **consumidor**: o campo `perfil`, se enviado, é ignorado. O primeiro administrador é promovido manualmente no banco de dados.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nome
              - email
              - senha
              properties:
                nome:
                  type: string
                  example: Ricardo
                email:
                  type: string
                  example: ricardo@email.com
                senha:
                  type: string
                  example: '123456'
      responses:
        201:
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 6ac6706fa7c58396d877575f
                      nome:
                        type: string
                        example: Ricardo
                      email:
                        type: string
                        example: ricardo@email.com
                      perfil:
                        type: string
                        enum:
                        - admin
                        - consumidor
                        example: consumidor
                      senha:
                        type: string
                        description: Senha armazenada em hash (bcrypt), nunca em texto puro
                        example: $2b$10$AHbokmpZq75WJkgF8FDY4ec.wjrLKKMsrA7rJFVKl.nnyYLk9eQ.i
                      __v:
                        type: integer
                        example: 0
        400:
          description: Dados inválidos (nome, e-mail ou senha ausentes)
        409:
          description: E-mail já cadastrado
        500:
          description: Erro interno do servidor
  /usuario/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      description: ID do usuário (ObjectId do MongoDB)
    get:
      tags:
      - Usuários
      summary: Busca um usuário pelo ID
      description: Requer token JWT com perfil **admin**. A senha nunca é retornada.
      security:
      - bearerAuth: []
      responses:
        200:
          description: Encontrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 6ac6706fa7c58396d877575f
                      nome:
                        type: string
                        example: Ricardo
                      email:
                        type: string
                        example: ricardo@email.com
                      perfil:
                        type: string
                        enum:
                        - admin
                        - consumidor
                        example: consumidor
        400:
          description: ID em formato inválido
        401:
          description: 'Não autenticado: token não informado ou inválido (ex.: Token não informado, Token invalido)'
        403:
          description: 'Acesso negado: apenas administradores'
        404:
          description: Usuário não encontrado
        500:
          description: Erro interno do servidor
    put:
      tags:
      - Usuários
      summary: Atualiza um usuário
      description: Requer token JWT com perfil **admin**. Campos não enviados permanecem inalterados. Se a senha for enviada, é gravada em hash. O campo `perfil` não pode ser alterado por esta rota.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: Ricardo Silva
                email:
                  type: string
                  example: ricardo@email.com
                senha:
                  type: string
                  example: novaSenha123
      responses:
        200:
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 6ac6706fa7c58396d877575f
                      nome:
                        type: string
                        example: Ricardo
                      email:
                        type: string
                        example: ricardo@email.com
                      perfil:
                        type: string
                        enum:
                        - admin
                        - consumidor
                        example: consumidor
        400:
          description: Dados inválidos (campo vazio) ou ID em formato inválido
        401:
          description: 'Não autenticado: token não informado ou inválido (ex.: Token não informado, Token invalido)'
        403:
          description: 'Acesso negado: apenas administradores'
        404:
          description: Usuário não encontrado
        500:
          description: Erro interno do servidor
    delete:
      tags:
      - Usuários
      summary: Remove um usuário
      description: Requer token JWT com perfil **admin**.
      security:
      - bearerAuth: []
      responses:
        204:
          description: Removido (sem corpo)
        400:
          description: ID em formato inválido
        401:
          description: 'Não autenticado: token não informado ou inválido (ex.: Token não informado, Token invalido)'
        403:
          description: 'Acesso negado: apenas administradores'
        404:
          description: Usuário não encontrado
        500:
          description: Erro interno do servidor
  /obra:
    get:
      tags:
      - Obras
      summary: Lista todas as obras
      description: Requer token JWT (perfil **admin** ou **consumidor**).
      security:
      - bearerAuth: []
      responses:
        200:
          description: Lista de obras
          content:
            application/json:
              schema:
                type: object
                properties:
                  obras:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 665f1a2b3c4d5e6f7a8b9d01
                        titulo:
                          type: string
                          example: Abaporu
                        tecnica:
                          type: string
                          example: Óleo sobre tela
                        movimento:
                          type: string
                          example: Modernismo
                        imagem:
                          type: string
                          example: https://exemplo.com/abaporu.jpg
                        ano:
                          type: integer
                          example: 1928
                        artistaId:
                          type: string
                          example: 665f1a2b3c4d5e6f7a8b9c01
                        acervo:
                          type: object
                          required:
                          - instituicao
                          properties:
                            instituicao:
                              type: string
                              example: MASP
                            localizacao:
                              type: string
                              example: São Paulo, SP
                            formaAquisicao:
                              type: string
                              example: Doação
                            anoAquisicao:
                              type: integer
                              example: 1947
                            _id:
                              type: string
                              readOnly: true
                              example: 6ac040fa4aa555444559f914
                      required:
                      - titulo
                      - ano
                      - artistaId
        401:
          description: 'Não autenticado: token não informado ou inválido (ex.: Token não informado, Token invalido)'
        500:
          description: Erro interno do servidor
    post:
      tags:
      - Obras
      summary: Cadastra uma obra
