                  example: 665f1a2b3c4d5e6f7a8b9c01
                acervo:
                  type: object
                  required:
                  - instituicao
                  properties:
                    instituicao:
                      type: string
                      example: MASP
                    localizacao:
                      type: string
                      example: São Paulo, SP
                    formaAquisicao:
                      type: string
                      example: Doação
                    anoAquisicao:
                      type: integer
                      example: 1947
                    _id:
                      type: string
                      readOnly: true
                      example: 6ac040fa4aa555444559f914
      responses:
        201:
          description: Obra criada com sucesso
        400:
          description: Dados inválidos (campo obrigatório ausente, tipo errado ou ID inválido)
        401:
