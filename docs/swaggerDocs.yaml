                cidadeNatal:
                  type: string
                  example: Capivari
                nascimento:
                  type: string
                  format: date
                  example: '1886-09-01'
                morte:
                  type: string
                  format: date
                  example: '1973-01-17'
      responses:
        201:
          description: Artista criado com sucesso
        400:
          description: Dados inválidos (campo obrigatório ausente, tipo errado ou ID inválido)
        500:
          description: Erro interno do servidor
