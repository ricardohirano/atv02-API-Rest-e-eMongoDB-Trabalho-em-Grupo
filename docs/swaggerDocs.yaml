        500:
          description: Erro interno do servidor
    put:
      tags:
      - Artistas
      summary: Atualiza um artista
      description: Campos não enviados permanecem inalterados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nome
              properties:
                nome:
